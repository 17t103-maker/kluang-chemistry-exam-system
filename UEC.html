let currentChapter = '第19章';
let currentNum = 1;
let currentStepIdx = -1;

window.onload = function() {
    renderButtons('第19章');
    loadCardData('第19章', 1);
};

function switchChapter(chap) {
    currentChapter = chap;
    currentNum = 1;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(chap));
    });
    hideAllQuestions();
    renderButtons(chap);
    loadCardData(chap, 1);
}

function renderButtons(chap) {
    const container = document.getElementById('numberButtons');
    container.innerHTML = '';
    const list = chapterDatabase[chap] || [];

    list.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = `num-btn ${item.num === currentNum ? 'active' : ''}`;
        btn.innerText = `第 ${index + 1} 题 (${item.type})`;
        btn.onclick = () => {
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            hideAllQuestions();
            loadCardData(chap, item.num);
        };
        container.appendChild(btn);
    });
}

function loadCardData(chap, num) {
    currentNum = num;
    currentStepIdx = -1;

    const list = chapterDatabase[chap] || [];
    const item = list.find(q => q.num === num);

    if (!item) return;

    document.getElementById('qTitle').innerText = item.section + ' ' + item.year;
    document.getElementById('qBadge').innerText = item.type;
    document.getElementById('qBody').innerHTML = item.body;

    const stepsWrapper = document.getElementById('stepsWrapper');
    stepsWrapper.innerHTML = '';

    item.steps.forEach((stepObj, idx) => {
        const div = document.createElement('div');
        div.className = 'step-container';
        div.id = 'step_' + idx;
        div.innerHTML = 
            '<div class="step-header">' +
                '<span class="step-tag">思考解析 ' + (idx + 1) + '</span>' +
                '<span class="step-title">' + stepObj.title + '</span>' +
            '</div>' +
            '<div class="thinking-box"><strong>💡 关键突破口：</strong>' + stepObj.think + '</div>' +
            '<div class="derivation-box">' + stepObj.derivation + '</div>';
        stepsWrapper.appendChild(div);
    });

    document.getElementById('ansContent').innerHTML = item.ans;
    document.getElementById('finalAns').classList.remove('active');

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = false;
    nextBtn.innerText = "💡 思考解题策略 / 关键知识点";

    triggerMathJax();
}

function revealNextStep() {
    const list = chapterDatabase[currentChapter] || [];
    const item = list.find(q => q.num === currentNum);
    if (!item) return;

    if (currentStepIdx < item.steps.length - 1) {
        currentStepIdx++;
        const targetStep = document.getElementById('step_' + currentStepIdx);
        if (targetStep) targetStep.classList.add('active');

        if (currentStepIdx === item.steps.length - 1) {
            document.getElementById('nextBtn').innerText = "💡 已展示全部解析步骤";
            document.getElementById('nextBtn').disabled = true;
        }
    }
    triggerMathJax();
}

function toggleAnswer() {
    document.getElementById('finalAns').classList.toggle('active');
    triggerMathJax();
}

function resetCurrentCard() {
    loadCardData(currentChapter, currentNum);
}

function showAllQuestions(withAnswers) {
    document.getElementById('questionDisplayArea').style.display = 'none';
    const viewContainer = document.getElementById('allQuestionsView');
    const listContainer = document.getElementById('listContainer');
    
    document.getElementById('viewListTitle').innerText = withAnswers ? "全卷真题与完整参考答案" : "全卷真题清览（试卷模式）";
    listContainer.innerHTML = '';

    ['第19章', '第20章', '第21章', '第22章'].forEach(chap => {
        const chapHeader = document.createElement('h3');
        chapHeader.style.color = 'var(--primary-color)';
        chapHeader.style.borderBottom = '2px solid var(--primary-color)';
        chapHeader.style.paddingBottom = '5px';
        chapHeader.style.marginTop = '25px';
        chapHeader.innerText = `${chap} 历届考题`;
        listContainer.appendChild(chapHeader);

        const dataList = chapterDatabase[chap] || [];
        dataList.forEach((q, idx) => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'list-q-item';
            
            let htmlContent = `<div class="list-q-title">第 ${idx + 1} 题 (${q.type}) - ${q.section} ${q.year}</div>`;
            htmlContent += `<div style="font-size:1.02rem; line-height:1.7;">${q.body}</div>`;

            if (withAnswers) {
                htmlContent += `<div class="list-ans-box">${q.ans}</div>`;
            }

            itemDiv.innerHTML = htmlContent;
            listContainer.appendChild(itemDiv);
        });
    });

    viewContainer.classList.add('active');
    triggerMathJax();
}

function hideAllQuestions() {
    document.getElementById('allQuestionsView').classList.remove('active');
    document.getElementById('questionDisplayArea').style.display = 'block';
    triggerMathJax();
}

function triggerMathJax() {
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise().catch(function (err) {
            console.log('MathJax error: ' + err.message);
        });
    }
}
</script>

</html>
