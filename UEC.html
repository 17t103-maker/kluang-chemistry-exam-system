let currentChapter = '第19章';
let currentNum = 1;
let currentStepIdx = -1;

window.onload = function() {
    renderButtons('第19章');
    loadCardData('第19章', 1);
};

function switchChapter(chap) {
    currentChapter = chap;
    currentNum = 1;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(chap));
    });
    renderButtons(chap);
    loadCardData(chap, 1);
}

function renderButtons(chap) {
    const container = document.getElementById('numberButtons');
    container.innerHTML = '';
    const list = chapterDatabase[chap] || [];

    list.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = `num-btn ${item.num === currentNum ? 'active' : ''}`;
        btn.innerText = `第 ${index + 1} 题 (${item.type})`;
        btn.onclick = () => {
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadCardData(chap, item.num);
        };
        container.appendChild(btn);
    });
}

function loadCardData(chap, num) {
    currentNum = num;
    currentStepIdx = -1;

    const list = chapterDatabase[chap] || [];
    const item = list.find(q => q.num === num);

    if (!item) return;

    document.getElementById('qTitle').innerText = item.section + ' ' + item.year;
    document.getElementById('qBadge').innerText = item.type;
    document.getElementById('qBody').innerHTML = item.body;

    const stepsWrapper = document.getElementById('stepsWrapper');
    stepsWrapper.innerHTML = '';

    item.steps.forEach((stepObj, idx) => {
        const div = document.createElement('div');
        div.className = 'step-container';
        div.id = 'step_' + idx;
        div.innerHTML = 
            '<div class="step-header">' +
                '<span class="step-tag">思考解析 ' + (idx + 1) + '</span>' +
                '<span class="step-title">' + stepObj.title + '</span>' +
            '</div>' +
            '<div class="thinking-box"><strong>💡 关键突破口：</strong>' + stepObj.think + '</div>' +
            '<div class="derivation-box">' + stepObj.derivation + '</div>';
        stepsWrapper.appendChild(div);
    });

    document.getElementById('ansContent').innerHTML = item.ans;
    document.getElementById('finalAns').classList.remove('active');

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = false;
    nextBtn.innerText = "💡 思考解题策略 / 关键知识点";

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function revealNextStep() {
    const list = chapterDatabase[currentChapter] || [];
    const item = list.find(q => q.num === currentNum);
    if (!item) return;

    if (currentStepIdx < item.steps.length - 1) {
        currentStepIdx++;
        const targetStep = document.getElementById('step_' + currentStepIdx);
        if (targetStep) targetStep.classList.add('active');

        if (currentStepIdx === item.steps.length - 1) {
            document.getElementById('nextBtn').innerText = "💡 已展示全部解析步骤";
            document.getElementById('nextBtn').disabled = true;
        }
    }
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function toggleAnswer() {
    document.getElementById('finalAns').classList.toggle('active');
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function resetCurrentCard() {
    loadCardData(currentChapter, currentNum);
}

// AI Chatbot
function toggleChatBox() {
    document.getElementById('chatBox').classList.toggle('active');
}

let selectedTextStore = "";
document.addEventListener('mouseup', function(e) {
    const tooltip = document.getElementById('selection-tooltip');
    const selection = window.getSelection();
    const text = selection.toString().trim();
    if (e.target.closest('#chatBox') || e.target.closest('.chat-widget-toggle')) return;

    if (text.length > 0) {
        selectedTextStore = text;
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        tooltip.style.left = (rect.left + window.scrollX + (rect.width / 2) - 40) + 'px';
        tooltip.style.top = (rect.top + window.scrollY - 40) + 'px';
        tooltip.style.display = 'block';
    } else {
        tooltip.style.display = 'none';
    }
});

function askSelectedText() {
    if (!selectedTextStore) return;
    toggleChatBox();
    document.getElementById('selection-tooltip').style.display = 'none';
    const prompt = '请帮我讲解高二化学概念：“' + selectedTextStore + '”';
    appendMessage(prompt, 'user');
    fetchAIResponse(prompt);
}

function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;
    appendMessage(text, 'user');
    input.value = '';
    fetchAIResponse(text);
}

function appendMessage(text, sender) {
    const msgContainer = document.getElementById('chatMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'chat-msg ' + sender;
    msgDiv.innerHTML = text;
    msgContainer.appendChild(msgDiv);
    msgContainer.scrollTop = msgContainer.scrollHeight;
}

async function fetchAIResponse(userQuery) {
    appendMessage("<i>AI 导师思考中...</i>", 'ai');
    setTimeout(() => {
        const msgs = document.querySelectorAll('.chat-msg.ai');
        const lastMsg = msgs[msgs.length - 1];
        lastMsg.innerHTML = '关于知识点“<b>' + userQuery + '</b>”，建议结合课本对应章节的公式进行推导与理解。';
    }, 1000);
}
