<script>
// 小测验完整数据库
const quizDatabase = {
    'Ch19': [
        {
            num: 1, title: '第19章 - 【题目 1】',
            body: '根据热化学方程式判断下列叙述哪项正确？【20%】<br>(1) $\\text{H}_2(g) + \\frac{1}{2}\\text{O}_2(g) \\rightarrow \\text{H}_2\\text{O}(g) \\quad \\Delta H = -241.8\\,\\text{kJ/mol}$<br>(2) $2\\text{H}_2(g) + \\text{O}_2(g) \\rightarrow 2\\text{H}_2\\text{O}(l) \\quad \\Delta H = -571.6\\,\\text{kJ/mol}$<br><br>A. 电解 $1\\,\\text{mol}$ 的水需吸收 $285.8\\,\\text{kJ}$ 的热量<br>B. 水的生成热为 $-571.6\\,\\text{kJ/mol}$<br>C. 氢气的燃烧热为 $-241.8\\,\\text{kJ}$ 的热量<br>D. $1\\,\\text{mol}$ 水蒸气转化成 $1\\,\\text{mol}$ 水的反应热为 $44\\,\\text{kJ}$',
            steps: [{
                title: '思考策略：基本概念辨析与反应热推导',
                think: '<strong>关键思考方向：</strong>生成热与燃烧热的定义分别是什么？水的物理状态（液态与气态）对反应热有何影响？',
                derivation: '<b>解析与推导：</b><br>• 由式(2)两边同除以2可得：$\\text{H}_2(g) + \\frac{1}{2}\\text{O}_2(g) \\rightarrow \\text{H}_2\\text{O}(l) \\quad \\Delta H = -285.8\\,\\text{kJ/mol}$。<br>• <b>A项（正确）：</b>逆反应（电解 $1\\,\\text{mol}$ 液态水）需吸收 $285.8\\,\\text{kJ}$ 热量。<br>• <b>B项（错误）：</b>生成 $1\\,\\text{mol}$ 液态水的生成热应为 $-285.8\\,\\text{kJ/mol}$。<br>• <b>C项（错误）：</b>燃烧热要求生成稳定液态水，故氢气燃烧热为 $285.8\\,\\text{kJ/mol}$。<br>• <b>D项（错误）：</b>$\\text{H}_2\\text{O}(g) \\rightarrow \\text{H}_2\\text{O}(l)$，$\\Delta H = -285.8 - (-241.8) = -44\\,\\text{kJ/mol}$（放热，应带负号）。'

            ans: '<b>正确答案：A</b>'
        },
        {
            num: 2, title: '第19章 - 【题目 2】',
            body: '$200\\,\\text{mL}\\ 3\\text{M}$ 的 $\\text{KOH}(aq)$ 和 $200\\,\\text{mL}\\ 2\\text{M}$ 的硫酸混合，求反应热。【20%】<br><br>A. $-57.3\\,\\text{kJ} \\times 0.4$ &nbsp;&nbsp;&nbsp; B. $-57.3\\,\\text{kJ} \\times 0.6$<br>C. $-57.3\\,\\text{kJ} \\times 0.8$ &nbsp;&nbsp;&nbsp; D. $-57.3\\,\\text{kJ}$',
            steps: [{
                title: '思考策略：限量试剂与中和热计算',
                think: '<strong>关键思考方向：</strong>强酸与强碱中和热标准值是多少？混合后哪个离子（\\text{H}^+ 或 \\text{OH}^-）是限量试剂？',
                derivation: '<b>计算过程：</b><br>1. 标准中和热：$\\text{H}^+(aq) + \\text{OH}^-(aq) \\rightarrow \\text{H}_2\\text{O}(l) \\quad \\Delta H = -57.3\\,\\text{kJ/mol}$<br>2. 计算摩尔数：<br>&nbsp;&nbsp; $n(\\text{OH}^-) = 0.200\\,\\text{L} \\times 3\\,\\text{mol/L} = 0.6\\,\\text{mol}$<br>&nbsp;&nbsp; $n(\\text{H}^+) = 2 \\times (0.200\\,\\text{L} \\times 2\\,\\text{mol/L}) = 0.8\\,\\text{mol}$<br>3. $\\text{OH}^-$ 为完全反应的限量试剂，实际生成 $0.6\\,\\text{mol}\\ \\text{H}_2\\text{O}$。<br>4. 总反应热 $\\Delta H = -57.3\\,\\text{kJ/mol} \\times 0.6\\,\\text{mol} = -57.3\\,\\text{kJ} \\times 0.6$。'

            ans: '<b>正确答案：B</b>'

        {
            num: 3, title: '第19章 - 【题目 3】',
            body: '如右图所示热焓变化，回答下列问题：（不需计算过程）【20%】<br><br>' +
                  '<div style="text-align:center; font-family: monospace; line-height: 1.5; margin: 15px 0; background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #cbd5e1;">' +

                  'Z ──────(&Delta;H₄ = 100kJ)──────> Y' +
                  '</div><br>' +
                  'I. 写出 $\\Delta H_1$、$\\Delta H_2$、$\\Delta H_3$、$\\Delta H_4$ 的关系式：_______<br>' +
                  'II. 计算 $\\Delta H_3$ 的值：_______<br>' +
                  'III. 计算 Z $\\rightarrow$ X 的热焓变化：_______',

                title: '思考策略：盖斯定律（路径无关原理）应用',

const sectionCounts = { 'Ch19': 6, 'Ch20': 6, 'Ch21': 6 };
let currentSection = 'Ch19';
let currentNum = 1;
let currentStepIndex = -1;

window.onload = function() {
    renderNumberButtons('Ch19');
    loadQuestionData('Ch19', 1);
};

function switchSection(sec) {
    currentSection = sec;
    currentNum = 1;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(sec));
    });
    hideAllQuestions();
    renderNumberButtons(sec);
    loadQuestionData(sec, 1);
}

function renderNumberButtons(sec) {
    const container = document.getElementById('numberButtons');
    container.innerHTML = '';
    const total = sectionCounts[sec];

    for (let i = 1; i <= total; i++) {
        const btn = document.createElement('button');
        btn.className = `num-btn ${i === currentNum ? 'active' : ''}`;
        btn.innerText = `第 ${i} 题`;
        btn.onclick = () => {
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            hideAllQuestions();
            loadQuestionData(sec, i);
        };
        container.appendChild(btn);
    }
}

function loadQuestionData(sec, num) {
    currentNum = num;
    currentStepIndex = -1;

    const dataList = quizDatabase[sec] || [];
    const qData = dataList.find(item => item.num === num) || {
        title: `题目 ${num}`,
        body: '数据加载中...',
        steps: [],
        ans: '暂无答案'
    };

    document.getElementById('qTitle').innerText = qData.title;
    document.getElementById('qBadge').innerText = sec === 'Ch19' ? '第19章' : (sec === 'Ch20' ? '第20章' : '第21-22.2章');
    document.getElementById('qBody').innerHTML = qData.body;

    const stepsWrapper = document.getElementById('stepsWrapper');
    stepsWrapper.innerHTML = '';
    
    qData.steps.forEach((stepObj, idx) => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step-container';
        stepDiv.id = `step_${idx}`;
        stepDiv.innerHTML = `
            <div class="step-header">
                <span class="step-tag">策略 ${idx + 1}</span>
                <span class="step-title">${stepObj.title}</span>
            </div>
            <div class="thinking-box">${stepObj.think}</div>
            <div class="derivation-box">${stepObj.derivation}</div>
        `;
        stepsWrapper.appendChild(stepDiv);
    });

    document.getElementById('ansContent').innerHTML = qData.ans;
    document.getElementById('finalAns').classList.remove('active');

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = false;
    nextBtn.innerText = "💡 思考解题策略 / 关键知识点";

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function revealNextStep() {
    const dataList = quizDatabase[currentSection] || [];
    const qData = dataList.find(item => item.num === currentNum);
    if (!qData || qData.steps.length === 0) return;

    const totalSteps = qData.steps.length;

    if (currentStepIndex < totalSteps - 1) {
        currentStepIndex++;
        const currentStepEl = document.getElementById(`step_${currentStepIndex}`);
        if (currentStepEl) currentStepEl.classList.add('active');

        if (currentStepIndex === totalSteps - 1) {
            document.getElementById('nextBtn').innerText = "💡 已展示全部思考策略";
            document.getElementById('nextBtn').disabled = true;
        }
    }

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function toggleAnswer() {
    const ansBox = document.getElementById('finalAns');
    ansBox.classList.toggle('active');
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function resetCurrentCard() {
    loadQuestionData(currentSection, currentNum);
}

/* 全卷查看功能实现 */
function showAllQuestions(withAnswers) {
    document.getElementById('questionDisplayArea').style.display = 'none';
    const viewContainer = document.getElementById('allQuestionsView');
    const listContainer = document.getElementById('listContainer');
    
    document.getElementById('viewListTitle').innerText = withAnswers ? "全卷小测验题目与完整参考答案" : "全卷小测验题目清览（试卷模式）";
    listContainer.innerHTML = '';

    ['Ch19', 'Ch20', 'Ch21'].forEach(sec => {
        const secHeader = document.createElement('h3');
        secHeader.style.color = 'var(--primary-color)';
        secHeader.style.borderBottom = '2px solid var(--primary-color)';
        secHeader.style.paddingBottom = '5px';
        secHeader.style.marginTop = '25px';
        secHeader.innerText = sec === 'Ch19' ? '第19章 小测验' : (sec === 'Ch20' ? '第20章 小测验' : '第21-22.2章 小测验');
        listContainer.appendChild(secHeader);

        const dataList = quizDatabase[sec] || [];
        dataList.forEach(q => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'list-q-item';
            
            let htmlContent = `<div class="list-q-title">${q.title}</div>`;
            htmlContent += `<div style="font-size:1.02rem; line-height:1.7;">${q.body}</div>`;

            if (withAnswers) {
                htmlContent += `<div class="list-ans-box">${q.ans}</div>`;
            }

            itemDiv.innerHTML = htmlContent;
            listContainer.appendChild(itemDiv);
        });
    });

    viewContainer.classList.add('active');

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function hideAllQuestions() {
    document.getElementById('allQuestionsView').classList.remove('active');
    document.getElementById('questionDisplayArea').style.display = 'block';
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}
