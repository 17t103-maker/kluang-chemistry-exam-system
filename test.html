const sectionCounts = { 'Ch19': 6, 'Ch20': 6, 'Ch21': 6 };
let currentSection = 'Ch19';
let currentNum = 1;
let currentStepIndex = -1;

window.onload = function() {
    renderNumberButtons('Ch19');
    loadQuestionData('Ch19', 1);
};

function switchSection(sec) {
    currentSection = sec;
    currentNum = 1;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(sec));
    });
    renderNumberButtons(sec);
    loadQuestionData(sec, 1);
}

function renderNumberButtons(sec) {
    const container = document.getElementById('numberButtons');
    container.innerHTML = '';
    const total = sectionCounts[sec];

    for (let i = 1; i <= total; i++) {
        const btn = document.createElement('button');
        btn.className = `num-btn ${i === currentNum ? 'active' : ''}`;
        btn.innerText = `第 ${i} 题`;
        btn.onclick = () => {
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadQuestionData(sec, i);
        };
        container.appendChild(btn);
    }
}

function loadQuestionData(sec, num) {
    currentNum = num;
    currentStepIndex = -1;

    const dataList = quizDatabase[sec] || [];
    const qData = dataList.find(item => item.num === num) || {
        title: `题目 ${num}`,
        body: '数据加载中...',
        steps: [],
        ans: '暂无答案'
    };

    document.getElementById('qTitle').innerText = qData.title;
    document.getElementById('qBadge').innerText = sec === 'Ch19' ? '第19章' : (sec === 'Ch20' ? '第20章' : '第21-22.2章');
    document.getElementById('qBody').innerHTML = qData.body;

    const stepsWrapper = document.getElementById('stepsWrapper');
    stepsWrapper.innerHTML = '';
    
    qData.steps.forEach((stepObj, idx) => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step-container';
        stepDiv.id = `step_${idx}`;
        stepDiv.innerHTML = `
            <div class="step-header">
                <span class="step-tag">策略 ${idx + 1}</span>
                <span class="step-title">${stepObj.title}</span>
            </div>
            <div class="thinking-box">${stepObj.think}</div>
            <div class="derivation-box">${stepObj.derivation}</div>
        `;
        stepsWrapper.appendChild(stepDiv);
    });

    document.getElementById('ansContent').innerHTML = qData.ans;
    document.getElementById('finalAns').classList.remove('active');

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = false;
    nextBtn.innerText = "💡 思考解题策略 / 关键知识点";

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function revealNextStep() {
    const dataList = quizDatabase[currentSection] || [];
    const qData = dataList.find(item => item.num === currentNum);
    if (!qData || qData.steps.length === 0) return;

    const totalSteps = qData.steps.length;

    if (currentStepIndex < totalSteps - 1) {
        currentStepIndex++;
        const currentStepEl = document.getElementById(`step_${currentStepIndex}`);
        if (currentStepEl) currentStepEl.classList.add('active');

        if (currentStepIndex === totalSteps - 1) {
            document.getElementById('nextBtn').innerText = "💡 已展示全部思考策略";
            document.getElementById('nextBtn').disabled = true;
        }
    }

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function toggleAnswer() {
    const ansBox = document.getElementById('finalAns');
    ansBox.classList.toggle('active');
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function resetCurrentCard() {
    loadQuestionData(currentSection, currentNum);
}
</script>
