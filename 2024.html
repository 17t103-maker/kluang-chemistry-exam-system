<html lang="zh-CN">
<head>

    <script>
        window.MathJax = {
            tex: {

                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }

    <style>
        :root {
            --primary-color: #1a436d;
            --accent-color: #2c5e8a;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --step-bg: #f0f4f8;
            --success-color: #2e7d32;
            --text-color: #333333;
            --think-color: #d97706;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 10px 0 20px 0;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.6rem;
        }

        header p {
            color: #666;
            margin: 0;
        }

        /* 交互控制台 */
        .control-panel {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .section-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .type-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #e0e6ed;
            color: var(--primary-color);
            border: none;
            padding: 9px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .number-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .num-btn {
            background-color: white;
            border: 1px solid #cbd5e1;
            color: #334155;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .num-btn:hover, .num-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* 题目展示卡片 */
        .question-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .question-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .badge-type {
            background-color: var(--accent-color);
            color: white;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .question-body {
            font-size: 1.05rem;
            margin-bottom: 20px;
            line-height: 1.8;
        }

        /* 适中图片尺寸样式 */
        .question-img {
            max-width: 450px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin: 15px 0;
            display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* 引导解析步骤 */
        .step-container {
            display: none;
            margin-top: 18px;
            border-left: 4px solid var(--primary-color);
            background: var(--step-bg);
            padding: 18px 20px;
            border-radius: 0 8px 8px 0;
            animation: fadeIn 0.3s ease-in-out;
        }

        .step-container.active {
            display: block;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .step-tag {
            background: var(--primary-color);
            color: white;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .step-title {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 1.05rem;
        }

        .thinking-box {
            background: #fffbe3;
            border-left: 3px solid var(--think-color);
            padding: 10px 14px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #78350f;
        }

        .thinking-box strong {
            color: #b45309;
        }

        .derivation-box {
            margin-top: 8px;
            font-size: 0.98rem;
        }

        /* 最终答案 */
        .final-answer {
            display: none;
            margin-top: 25px;
            background-color: #e8f5e9;
            border: 2px dashed var(--success-color);
            border-radius: 8px;
            padding: 20px;
            color: #1b5e20;
            animation: fadeIn 0.4s ease-in-out;
        }

        .final-answer.active {
            display: block;
        }

        .final-answer h3 {
            margin-top: 0;
            color: var(--success-color);
            margin-bottom: 10px;
        }

        /* 按钮组 */
        .action-area {
            margin-top: 22px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 11px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-ans {
            background: linear-gradient(135deg, #2e7d32, #388e3c);
        }

        .btn-reset {
            background: #757575;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= 1. 划词提问气泡样式 ================= */
        #selection-tooltip {
            position: absolute;
            display: none;
            background: #1a436d;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: transform 0.1s ease;
        }
        #selection-tooltip:hover {
            transform: scale(1.05);
            background: #2c5e8a;
        }

        /* ================= 2. 右下角 AI 对话机器人样式 ================= */
        .chat-widget-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1a436d, #2c5e8a);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 999;
            transition: all 0.3s ease;
        }
        .chat-widget-toggle:hover {
            transform: scale(1.1);
        }

        .chat-box-container {
            position: fixed;
            bottom: 95px;
            right: 25px;
            width: 360px;
            height: 520px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            z-index: 999;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .chat-box-container.active {
            display: flex;
        }

        .chat-header {
            background: var(--primary-color);
            color: white;
            padding: 12px 16px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header .close-btn {
            cursor: pointer;
            font-size: 1.2rem;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .chat-msg.user {
            align-self: flex-end;
            background: var(--primary-color);
            color: white;
            border-bottom-right-radius: 2px;
        }
        .chat-msg.ai {
            align-self: flex-start;
            background: #e2e8f0;
            color: #333;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #e2e8f0;
        }
        .chat-input-area input {
            flex: 1;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 20px;
            outline: none;
        }
        .chat-input-area button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            margin-left: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>居銮中华中学 2024下半年统测 高二理科化学</h1>
        <p>全卷题目完整收录 · LaTeX 公式标准排版 · 策略与知识点思考引导</p>
    </header>

    <!-- 交互控制台 -->
    <div class="control-panel">
        <div class="section-title">第一步：选择题型项目</div>
        <div class="type-tabs">
            <button class="tab-btn active" onclick="switchSection('甲')">甲) 选择题 (20题)</button>
            <button class="tab-btn" onclick="switchSection('乙')">乙) 填充题 (10题)</button>
            <button class="tab-btn" onclick="switchSection('丙')">丙) 必答题 (5题)</button>
            <button class="tab-btn" onclick="switchSection('丁')">丁) 选答题 (3大题)</button>
        </div>

        </div>
    </div>

    <!-- 动态题目展示卡片 -->
    <div id="questionDisplayArea">
        <div class="question-card">
            <div class="question-header">
                <span class="question-title" id="qTitle">加载中...</span>
                <span class="badge-type" id="qBadge">大题</span>
            </div>
            <div class="question-body" id="qBody"></div>

            <div id="stepsWrapper"></div>

            <div class="final-answer" id="finalAns">
                <h3>✨ 参考答案与解析结论：</h3>
                <div id="ansContent"></div>
            </div>

            <div class="action-area">
                <button class="btn" id="nextBtn" onclick="revealNextStep()">💡 思考解题策略 / 关键知识点</button>
                <button class="btn btn-ans" id="toggleAnsBtn" onclick="toggleAnswer()">👁️ 显示 / 隐藏答案</button>
                <button class="btn btn-reset" onclick="resetCurrentCard()">🔄 重新思考</button>
            </div>
        </div>
    </div>
</div>

<!-- 划词提问弹出的气泡按钮 -->
<div id="selection-tooltip" onclick="askSelectedText()">💡 询问 AI 导师</div>

<!-- 右下角 Chatbox 悬浮按钮 -->
<div class="chat-widget-toggle" onclick="toggleChatBox()">🤖</div>

<!-- 对话框主体 -->
<div class="chat-box-container" id="chatBox">
    <div class="chat-header">
        <span>化学学习 AI 导师</span>
        <span class="close-btn" onclick="toggleChatBox()">✕</span>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="chat-msg ai">👋 你好！我是居銮中华中学的化学 AI 导师。在解题过程中有任何不理解的概念或方程式，随时发给我，或者高亮选中页面上的文字询问我哦！</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">发送</button>
    </div>
</div>

const sectionCounts = { '甲': 20, '乙': 10, '丙': 5, '丁': 3 };
let currentSection = '甲';
let currentNum = 1;
let currentStepIndex = -1;

window.onload = function() {
    renderNumberButtons('甲');
    loadQuestionData('甲', 1);
};

function switchSection(sec) {
    currentSection = sec;
    currentNum = 1;
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(sec));
    });
    renderNumberButtons(sec);
    loadQuestionData(sec, 1);
}

function renderNumberButtons(sec) {
    const container = document.getElementById('numberButtons');
    container.innerHTML = '';
    const total = sectionCounts[sec];

    for (let i = 1; i <= total; i++) {
        const btn = document.createElement('button');
        btn.className = `num-btn ${i === currentNum ? 'active' : ''}`;
        btn.innerText = `第 ${i} 题`;
        btn.onclick = () => {
            document.querySelectorAll('.num-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadQuestionData(sec, i);
        };
        container.appendChild(btn);
    }
}

function loadQuestionData(sec, num) {
    currentNum = num;
    currentStepIndex = -1;

    const dataList = examDatabase[sec] || [];
    const qData = dataList.find(item => item.num === num) || {
        title: `${sec}) 第 ${num} 题`,
        body: '数据整理中...',
        steps: [],
        ans: '暂无答案'
    };

    document.getElementById('qTitle').innerText = qData.title;
    document.getElementById('qBadge').innerText = `${sec}) 部分`;
    document.getElementById('qBody').innerHTML = qData.body;

    const stepsWrapper = document.getElementById('stepsWrapper');
    stepsWrapper.innerHTML = '';
    
    qData.steps.forEach((stepObj, idx) => {
        const stepDiv = document.createElement('div');
        stepDiv.className = 'step-container';
        stepDiv.id = `step_${idx}`;
        stepDiv.innerHTML = `
            <div class="step-header">
                <span class="step-tag">策略 ${idx + 1}</span>
                <span class="step-title">${stepObj.title}</span>
            </div>
            <div class="thinking-box">${stepObj.think}</div>
            <div class="derivation-box">${stepObj.derivation}</div>
        `;
        stepsWrapper.appendChild(stepDiv);
    });

    document.getElementById('ansContent').innerHTML = qData.ans;
    document.getElementById('finalAns').classList.remove('active');

    const nextBtn = document.getElementById('nextBtn');
    nextBtn.disabled = false;
    nextBtn.innerText = "💡 思考解题策略 / 关键知识点";

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function revealNextStep() {
    const dataList = examDatabase[currentSection] || [];
    const qData = dataList.find(item => item.num === currentNum);
    if (!qData || qData.steps.length === 0) return;

    const totalSteps = qData.steps.length;

    if (currentStepIndex < totalSteps - 1) {
        currentStepIndex++;
        const currentStepEl = document.getElementById(`step_${currentStepIndex}`);
        if (currentStepEl) currentStepEl.classList.add('active');

        if (currentStepIndex === totalSteps - 1) {
            document.getElementById('nextBtn').innerText = "💡 已展示全部思考策略";
            document.getElementById('nextBtn').disabled = true;
        }
    }

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function toggleAnswer() {
    const ansBox = document.getElementById('finalAns');
    ansBox.classList.toggle('active');
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function resetCurrentCard() {
    loadQuestionData(currentSection, currentNum);
}

// ==================== AI Chatbox 交互与真实 Gemini API 接入 ====================
let selectedTextStore = "";

// 1. 监听划词事件（Highlighting）
document.addEventListener('mouseup', function(e) {
    const tooltip = document.getElementById('selection-tooltip');
    const selection = window.getSelection();
    const text = selection.toString().trim();

    // 如果是在对话框内部划词，则不弹出气泡
    if (e.target.closest('#chatBox') || e.target.closest('.chat-widget-toggle')) {
        return;
    }

    if (text.length > 0) {
        selectedTextStore = text;
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        
        // 动态计算气泡在屏幕上的位置（选中文本上方）
        tooltip.style.left = `${rect.left + window.scrollX + (rect.width / 2) - 50}px`;
        tooltip.style.top = `${rect.top + window.scrollY - 40}px`;
        tooltip.style.display = 'block';
    } else {
        tooltip.style.display = 'none';
    }
});

// 2. 点击“划词询问”气泡
function askSelectedText() {
    if (!selectedTextStore) return;
    
    // 展开 Chatbox
    const chatBox = document.getElementById('chatBox');
    chatBox.classList.add('active');
    
    // 隐藏提示气泡
    document.getElementById('selection-tooltip').style.display = 'none';
    
    // 构建提问文本并提交
    const prompt = `老师，请结合居銮高二化学课本知识点，帮我解释一下：“${selectedTextStore}”`;
    appendMessage(prompt, 'user');
    fetchAIResponse(prompt);
}

// 3. 展开 / 隐藏对话框
function toggleChatBox() {
    const chatBox = document.getElementById('chatBox');
    chatBox.classList.toggle('active');
}

// 4. 用户手动输入并发送消息
function sendMessage() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    input.value = '';
    fetchAIResponse(text);
}

// 在对话框中追加渲染消息
function appendMessage(text, sender) {
    const msgContainer = document.getElementById('chatMessages');
    const msgDiv = document.createElement('div');
    msgDiv.className = `chat-msg ${sender}`;
    msgDiv.innerHTML = text;
    msgContainer.appendChild(msgDiv);
    msgContainer.scrollTop = msgContainer.scrollHeight;
    
    // 如果生成了 LaTeX 公式，触发渲染
    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([msgDiv]);
    }
}

// 5. 通过安全后端代理进行流式获取 Gemini AI 回答
// 5. 通过安全后端代理获取 Gemini AI 回答（普通JSON响应模式）
async function fetchAIResponse(userQuery) {
    const msgContainer = document.getElementById('chatMessages');
    
    // 创建 AI 回答气泡
    const msgDiv = document.createElement('div');
    msgDiv.className = 'chat-msg ai';
    msgDiv.innerHTML = "<i>AI 导师正在查阅课本中...</i>";
    msgContainer.appendChild(msgDiv);
    msgContainer.scrollTop = msgContainer.scrollHeight;

    const PROXY_URL = 'https://gemini-proxy-nine-kappa.vercel.app/api/chat';

    const textbookKnowledgeBase = `
【居銮中华中学 高二理科化学 核心课本知识库】
1. 热化学与反应热（ΔH）：放热反应 ΔH < 0，吸热反应 ΔH > 0。赫斯定律：总反应热与途径无关。中和热约为 -57.3 kJ/mol。
2. 化学反应速率：影响因素包括浓度、压强、温度、催化剂。催化剂降活化能但不改反应热。
3. 化学平衡：勒沙特列原理：平衡往削弱外来影响的方向移动。
`;

    const systemInstruction = `你是一位来自马来西亚居銮中华中学的理科化学教师。请结合上述知识库回答学生问题，专业术语准确，公式使用 LaTeX 格式。`;
    const fullPrompt = `${systemInstruction}\n\n${textbookKnowledgeBase}\n\n学生提问：${userQuery}`;

    try {
        const response = await fetch(PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: fullPrompt })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
            let aiText = data.candidates[0].content.parts[0].text;
            aiText = aiText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            aiText = aiText.replace(/\n/g, '<br>');
            msgDiv.innerHTML = aiText;
        } else if (data.error) {
            console.error("API Error:", data.error);
            msgDiv.innerHTML = `请求错误：${data.error.message || JSON.stringify(data.error)}`;
        } else {
            msgDiv.innerHTML = "不好意思，老师刚才走神了，能请你再问一次吗？";
        }

    } catch (error) {
        console.error("Fetch Error:", error);
        msgDiv.innerHTML = "网络连接失败，请检查网络。";
    }

    if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise([msgDiv]);
    }
    msgContainer.scrollTop = msgContainer.scrollHeight;
}
</script>

</body>
</html>
