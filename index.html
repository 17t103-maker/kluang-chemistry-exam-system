<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>居銮中华中学 - 高二理科化学统测解析系统导航</title>
    <style>
        :root {
            --primary-color: #1a436d;
            --accent-color: #2c5e8a;
            --quiz-color-1: #2e7d32;
            --quiz-color-2: #388e3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }

        .nav-container {
            text-align: center;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .year-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(26, 67, 109, 0.2);
        }

        .quiz-btn {
            background: linear-gradient(135deg, var(--quiz-color-1), var(--quiz-color-2));
            box-shadow: 0 4px 15px rgba(46, 125, 50, 0.2);
        }

        .year-btn:hover {
            opacity: 0.9;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>

<div class="nav-container">
    <h1>居銮中华中学</h1>
    <p>高二理科化学统测与小测验解析系统</p>
    <div class="btn-group">
        <a href="2024.html" class="year-btn">📅 进入 2024 下半年统测解析</a>
        <a href="2025.html" class="year-btn">📅 进入 2025 下半年统测解析</a>
        <a href="test.html" class="year-btn quiz-btn">🧪 进入 章节小测验完整解析（第19~22.2章）</a>
    </div>
</div>

</body>
</html>
